name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/humai

      - name: Build distribution
        env:
          HUMAI_DIST_DIR: ${{ github.workspace }}/dist/humai-linux-x86_64
        run: ./distribute_app.sh

      - name: Package release archive
        run: |
          cd dist
          tar czf humai-linux-x86_64.tar.gz -C humai-linux-x86_64 .
          sha256sum humai-linux-x86_64.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/humai-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
