name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout FETCH_HEAD

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustup show

      - name: Build distribution
        env:
          HUMAI_DIST_DIR: ${{ github.workspace }}/dist/humai-linux-x86_64
        run: ./distribute_app.sh

      - name: Package release archive
        run: |
          cd dist
          tar czf humai-linux-x86_64.tar.gz -C humai-linux-x86_64 .
          sha256sum humai-linux-x86_64.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/humai-linux-x86_64.tar.gz \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/humai-linux-x86_64.tar.gz \
              dist/SHA256SUMS \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
