name: CI

on:
  # Only a pull request whose BASE branch is `main` runs the gate.
  #
  # `dev` is the integration branch: work lands there through pull requests or
  # direct pushes with no CI run, and the single `dev` -> `main` pull request is
  # where the three-OS gate actually decides whether a tree may ship. That is a
  # deliberate trade — `dev` breaks silently, and the cost is paid once at the
  # merge instead of on every intermediate commit.
  #
  # `branches` under `pull_request` filters on the pull request's TARGET branch,
  # not on the branch doing the pushing. So `dev` has to carry this same file for
  # its own pull requests to be skipped — it does, and main keeps its own copy —
  # and a feature branch merged into `dev` is covered by `dev`'s copy. Do not
  # "simplify" this to `branches-ignore`: it is the same field with inverted
  # meaning, and the next person reads it backwards.
  pull_request:
    branches: [main]
  # Called by release.yml as its gate, so a tag is only ever cut over a tree that
  # passed exactly what a pull request passes — not a second copy of the same steps.
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: rustup show

      # --workspace is required: apps/humaipsy, crates/humaipsy-core, and
      # crates/humaipsy-web are three separate workspace members, and a plain
      # `cargo test` run from any one member's own directory only tests that
      # one package — it silently skips the other members' tests/lints, it
      # doesn't error.
      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
