name: CI

on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: rustup show

      # --workspace is required: apps/humai and crates/humai-core are two
      # separate workspace members, and a plain `cargo test` run from either
      # member's own directory only tests that one package — it silently
      # skips the other member's tests/lints, it doesn't error.
      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
