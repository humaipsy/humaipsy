[package]
name = "humai-web"
description = "Local read-only browser dashboard for a running Humai instance: serves plain HTML/JS/CSS and a small JSON API over the chat Store."
version = "0.1.3"
edition = "2024"
rust-version = "1.85"

[dependencies]
humai-core = { path = "../humai-core" }

anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net"] }
