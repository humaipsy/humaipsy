[package]
name = "humai-core"
description = "Humai's engine: agent prompting, Ollama client, experiment recording, chat store, vault. No UI dependency."
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
sha2 = "0.10"
argon2 = "0.5"
secrecy = "0.10"
rpassword = "7"
hkdf = "0.12"
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"
