[package]
name = "humai-core"
description = "Humai's engine: agent prompting, Ollama client, experiment recording, chat store, vault. No UI dependency."
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
sha2 = "0.10"
argon2 = "0.5"
# Pulls in the `getrandom` backend for argon2's re-exported `password_hash::rand_core::OsRng`
# (used by `SaltString::generate` in vault.rs). This used to come in transitively via
# chacha20poly1305/hkdf before the unused Vault encrypted-blob mechanism was removed.
rand_core = { version = "0.6", features = ["getrandom"] }
secrecy = "0.10"
rpassword = "7"

[dev-dependencies]
tempfile = "3"
