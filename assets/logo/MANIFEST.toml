# HumaiPsy mark manifest
#
# Generated from the files in this directory. Every digest is the file's own.
# Regenerate this file whenever a mark or a rendered size changes.

[mark]
name = "humaipsy"
version = "1.0"
date = "2026-11-17"
grid = 32
rows = 3
viewbox = "0 0 32 32"
bbox = "x 4-28, y 5.25-26"
geometry = "rows (bubbles 5 tall, rx 2.5) at y 6-11, 13.5-18.5, 21-26; human bubble x 11-28; agent bubbles x 4-22; head circle (6.9,6.9) r 1.65 sharing centre line x 6.9 with shoulders half-ellipse x 4-9.8 bottom y 11.8 ry 2.75; agent face 4.2 square rx 1.2 at x 23.8-28, centred on its row; antenna stem 0.7 x 1.1 at x 25.55, knob r 0.5; detail bars 1.2 tall rx 0.6"

[palette]
peach = "#F5A97F"
sapphire = "#7DC4E4"
sapphire_deep = "#5E9FC7"
parchment = "#F4F1EA"
ink = "#24273A"
tile_top = "#363A4F"
tile_bottom = "#24273A"

[contrast]
peach_on_tile = "7.62:1"
sapphire_on_tile = "7.63:1"
sapphire_deep_on_tile = "5.09:1"
ink_on_sapphire = "7.63:1"
ink_on_sapphire_deep = "5.09:1"
white_on_ink = "14.72:1"
parchment_on_peach = "1.71:1 (non-text)"
parchment_on_sapphire_deep = "2.56:1 (non-text)"

[application_icon]
grid = 32
tile_radius = 8.5
tile_radius_px = 272
tile_gradient = "#363A4F -> #24273A, vertical"
rgba_px = 64
rgba = "R,G,B,A per pixel, row-major from the top left, unmultiplied"

[conditions]
rule = "two agents, one blue at two values"
cooperative = "sapphire"
argumentative = "sapphire deep"

