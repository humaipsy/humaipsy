<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-labelledby="psy-white-title">
  <title id="psy-white-title">HumaiPsy</title>

  <!-- The mark in one ink, for dark grounds and anything that can carry only one
       colour: every shape is white and the detail bars and eyes are knocked out of
       it, so the mark takes the colour of whatever is behind it. -->
  <defs>
    <mask id="psy-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="13" y="7.9" width="8.4" height="1.2" rx="0.6"/>
        <rect x="22" y="7.9" width="2.6" height="1.2" rx="0.6"/>
        <rect x="6.4" y="15.4" width="8.8" height="1.2" rx="0.6"/>
        <rect x="6.4" y="22.9" width="6" height="1.2" rx="0.6"/>
        <rect x="13" y="22.9" width="3.6" height="1.2" rx="0.6"/>
        <rect x="24.55" y="15.53" width="0.95" height="0.95" rx="0.24"/>
        <rect x="26.3" y="15.53" width="0.95" height="0.95" rx="0.24"/>
        <rect x="24.55" y="23.03" width="0.95" height="0.95" rx="0.24"/>
        <rect x="26.3" y="23.03" width="0.95" height="0.95" rx="0.24"/>
      </g>
    </mask>
  </defs>

  <g fill="#FFFFFF" mask="url(#psy-cut)">
    <circle cx="6.9" cy="6.9" r="1.65"/>
    <path d="M4 11.8a2.9 2.75 0 0 1 5.8 0Z"/>
    <rect x="11" y="6" width="17" height="5" rx="2.5"/>

    <rect x="4" y="13.5" width="18" height="5" rx="2.5"/>
    <rect x="25.55" y="12.9" width="0.7" height="1.1"/>
    <circle cx="25.9" cy="12.75" r="0.5"/>
    <rect x="23.8" y="13.9" width="4.2" height="4.2" rx="1.2"/>

    <rect x="4" y="21" width="18" height="5" rx="2.5"/>
    <rect x="25.55" y="20.4" width="0.7" height="1.1"/>
    <circle cx="25.9" cy="20.25" r="0.5"/>
    <rect x="23.8" y="21.4" width="4.2" height="4.2" rx="1.2"/>
  </g>
</svg>
