[package]
name = "humaipsy"
description = "HumaiPsy desktop app: egui/eframe UI over humaipsy-core, with an embedded local web dashboard."
version = "0.1.7"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
default-run = "humaipsy"
build = "build.rs"

[dependencies]

humaipsy-core = { path = "../crates/humaipsy-core" }
humaipsy-web = { path = "../crates/humaipsy-web" }

eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.37"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0"
serde_json = "1.0"
secrecy = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

