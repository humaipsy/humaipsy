[package]
name = "humai"
description = "Humai desktop app: egui/eframe UI over humai-core, with an embedded local web dashboard."
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
default-run = "humai"
build = "build.rs"

[dependencies]

humai-core = { path = "../../crates/humai-core" }
humai-web = { path = "../../crates/humai-web" }

eframe = "0.33"
egui = "0.33"
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }
egui-phosphor = "0.11.0"
egui_tiles = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0"
serde_json = "1.0"
secrecy = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

